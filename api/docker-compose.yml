services:
  db:
    image: postgres:17-alpine
    container_name: repetitor-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repetitor}
      POSTGRES_USER: ${POSTGRES_USER:-repetitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repetitor}
      TZ: Asia/Tashkent
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repetitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
