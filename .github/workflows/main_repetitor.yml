# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# Bu repo monorepo (api/ + web/), shuning uchun Azure avtomatik yaratgan
# standart shablon ishlamaydi: root'da requirements.txt yo'q, frontend
# build qilinmagan va migratsiya ishga tushmaydi. Shu fayl buni tuzatadi:
# frontend build qilinadi, api/web/dist ichiga joylanadi (WEB_DIST_DIR app
# setting shu bilan mos), va faqat api/ papkasi deploy artifacti sifatida
# yuboriladi — Oryx uni root deb qabul qilib, api/requirements.txt'ni
# to'g'ridan-to'g'ri topadi.

name: Build and deploy Python app to Azure Web App - repetitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (web/dist)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Faqat build vaqtida xatoni erta ushlash uchun — Azure tomonida
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true bo'lsa Oryx pip install'ni
      # yana o'zi bajaradi (shuning uchun antenv/ artifaktga kirmaydi).
      - name: Create and start virtual environment and install dependencies
        working-directory: api
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Frontend'ni backend papkasi ichiga joylaymiz: shu bilan deploy
      # artifakti = faqat api/ mazmuni, va WEB_DIST_DIR=web/dist app
      # setting'i (Azure'da qo'lda qo'shiladi) to'g'ri fayllarni topadi.
      - name: Place built frontend inside the backend package
        run: |
          rm -rf api/web
          mkdir -p api/web
          cp -r web/dist api/web/dist

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            api
            !api/antenv
            !api/.venv
            !api/dev.sqlite3
            !api/dev.sqlite3.bak

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'repetitor'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_21A93E923008483CB50FF2270F9F65E0 }}
